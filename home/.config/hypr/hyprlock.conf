# Lock screen, in the same glass style as the bar and panels.
# Lock with Super+L or the Power panel.

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 3, ease
    animation = inputFieldDots, 1, 2, ease
    animation = inputFieldColors, 1, 3, ease
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.jpg
    blur_passes = 3
    blur_size = 7
    noise = 0.012
    brightness = 0.62
    contrast = 0.95
    vibrancy = 0.2
}

# Day and date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(255, 255, 255, 0.82)
    font_size = 20
    font_family = Inter Medium
    position = 0, 285
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = rgba(255, 255, 255, 0.96)
    font_size = 118
    font_family = Inter Bold
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.3)
}

# Glass card behind the name and password box
shape {
    monitor =
    size = 340, 150
    color = rgba(42, 42, 46, 0.45)
    rounding = 24
    border_size = 1
    border_color = rgba(255, 255, 255, 0.18)
    position = 0, -150
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(0, 0, 0, 0.35)
}

label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.92)
    font_size = 15
    font_family = Inter SemiBold
    position = 0, -112
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    position = 0, -170
    halign = center
    valign = center
    rounding = -1
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.22)
    inner_color = rgba(255, 255, 255, 0.10)
    font_color = rgba(255, 255, 255, 0.95)
    font_family = Inter
    placeholder_text = <span foreground="##ffffff99">Enter password</span>
    fail_text = <span foreground="##ffffffcc">Wrong password</span>
    check_color = rgba(255, 255, 255, 0.6)
    fail_color = rgba(255, 105, 97, 0.85)
    capslock_color = rgba(255, 204, 0, 0.85)
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
}

# Small hint at the bottom
label {
    monitor =
    text = cmd[update:5000] playerctl metadata --format "{{ title }}  ·  {{ artist }}" 2>/dev/null
    color = rgba(255, 255, 255, 0.6)
    font_size = 12
    font_family = Inter
    position = 0, 40
    halign = center
    valign = bottom
}
