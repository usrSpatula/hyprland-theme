# Glass / frosted look for kitty (Hyprland blurs whatever is behind it)
background_opacity       0.60
dynamic_background_opacity yes

# Padding + rounded-feeling spacing
window_padding_width     14

# Font
font_size                12.0

# Smooth beam cursor, soft flash instead of a beep
cursor_shape             beam
cursor_blink_interval    0.7 ease-in-out
cursor_trail_decay       0.08 0.3
enable_audio_bell        no
visual_bell_duration     0.18 ease-out
visual_bell_color        #ffffff

# Rounded tabs, shown only when there's more than one
tab_bar_edge             top
tab_bar_style            powerline
tab_powerline_style      round
tab_bar_min_tabs         2
active_tab_background    #0a84ff
active_tab_foreground    #ffffff
inactive_tab_background  #1a1d26
inactive_tab_foreground  #9aa0b0

# Clean look
hide_window_decorations  yes
confirm_os_window_close  0
cursor_trail             3
remember_window_size     no
initial_window_width     110c
initial_window_height    32c

# Colors: soft dark glass, light text
foreground               #e6e8ee
background               #0e1016
selection_foreground     #0e1016
selection_background     #b8c4ff
cursor                   #ffffff

color0  #1a1d26
color8  #4a4f62
color1  #ff6b81
color9  #ff8a9b
color2  #7ee7a4
color10 #9bf0b9
color3  #ffd37a
color11 #ffe19f
color4  #7aa2ff
color12 #9db9ff
color5  #c79bff
color13 #d9b8ff
color6  #6fe0e8
color14 #96eaf0
color7  #d4d7e0
color15 #ffffff

# Ctrl+Shift+A then M / L to make it more / less see-through on the fly
map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
map ctrl+shift+a>1 set_background_opacity 1
map ctrl+shift+a>d set_background_opacity default
